server {
    # 同时监听 IPv4 与 IPv6：容器内 localhost 可能先解析到 ::1，
    # 只监听 IPv4 会让基于 localhost 的健康检查连接被拒。
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 真实 API 反代到 api 服务，前端始终使用同源 /api
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        return 200 'web-ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
